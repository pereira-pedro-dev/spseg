versao: 1
provisorio: true
nota: >-
  Regras provisórias, pendentes da sessão de metodologia. Cada registro entra em
  uma única categoria, por ordem de prioridade (o primeiro que casar vence).

# Pesos por natureza para o score relativo à cidade (provisorio, declarados
# manualmente; sem tabela oficial de sentença para SP). A chave é a natureza
# normalizada (sem acento, maiúscula, espaços colapsados; o hífen é mantido).
# Natureza não listada usa peso_padrao e a saída avisa quando isso acontece.
# Os pesos valem por ocorrência (linha), não por BO.
pesos:
  peso_padrao: 1
  por_natureza:
    HOMICIDIO DOLOSO: 10
    LATROCINIO: 10
    LESAO CORPORAL SEGUIDA DE MORTE: 9
    ESTUPRO: 8
    TENTATIVA DE HOMICIDIO: 8
    EXTORSAO MEDIANTE SEQUESTRO: 8
    ROUBO - OUTROS: 7
    ROUBO DE VEICULO: 3
    LESAO CORPORAL DOLOSA: 4


categorias:
  - id: invasao_residencia
    rotulo: Invasão de residência
    prioridade: 10
    regras:
      - tipo_local:
          - Residência
          - Residencia
          - Condomínio Residencial
          - Condominio Residencial
        natureza:
          - FURTO - OUTROS
          - FURTO DE VEÍCULO
          - FURTO DE CARGA
          - ROUBO - OUTROS
          - ROUBO DE VEÍCULO
          - ROUBO DE CARGA
          - HOMICÍDIO DOLOSO
          - TENTATIVA DE HOMICÍDIO
          - LESÃO CORPORAL DOLOSA
          - LESÃO CORPORAL SEGUIDA DE MORTE
          - LATROCÍNIO
          - ESTUPRO
          - ESTUPRO DE VULNERÁVEL
          - EXTORSÃO MEDIANTE SEQUESTRO

  - id: violencia_sexual
    rotulo: Violência sexual
    prioridade: 20
    regras:
      - natureza:
          - ESTUPRO
          - ESTUPRO DE VULNERÁVEL

  - id: crime_violento
    rotulo: Crimes violentos
    prioridade: 30
    regras:
      - natureza:
          - HOMICÍDIO DOLOSO
          - TENTATIVA DE HOMICÍDIO
          - LATROCÍNIO
          - LESÃO CORPORAL DOLOSA
          - LESÃO CORPORAL SEGUIDA DE MORTE
          - ROUBO - OUTROS
          - ROUBO DE VEÍCULO
          - ROUBO DE CARGA
          - EXTORSÃO MEDIANTE SEQUESTRO

  - id: crime_nao_violento
    rotulo: Crimes não violentos
    prioridade: 40
    regras:
      - natureza:
          - FURTO - OUTROS
          - FURTO DE VEÍCULO
          - FURTO DE CARGA

  - id: outros
    rotulo: Outros (drogas, armas, trânsito)
    prioridade: 999
    padrao: true
    regras: []
